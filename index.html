<!doctype html>
<html lang="en" data-page="welcome">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daniel Fasan | Welcome</title>
    <meta name="description" content="Daniel Fasan, digital developer. A playful welcome: drag the letters, drop shapes, then hold to enter." />
    <meta name="theme-color" content="#fbfbfd" />
    <link rel="icon" href="data:," />
    <script>
      // pick the theme before the first paint so there is no flash
      try {
        document.documentElement.dataset.theme = localStorage.getItem("df:theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/portrait.css" />
    <link rel="stylesheet" href="css/welcome.css" />
    <script src="js/site.js" defer></script>
  </head>
  <body>
    <header class="top" data-bar="welcome">
      <div class="brand glass" role="img" aria-label="Daniel Fasan"><span class="mono" aria-hidden="true">dF.</span></div>
      <div class="tools glass">
        <div class="snd-group">
          <button class="snd" data-sound aria-pressed="false"><span class="word">Sound</span> <span class="val">Off</span></button>
          <button class="icon" data-popover aria-expanded="false" aria-controls="vol-pop" aria-label="Music volume" title="Music volume">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7" /></svg>
          </button>
          <div class="pop vol-pop" id="vol-pop" hidden>
            <div class="vol-row">
              <label for="vol">Music</label>
              <input id="vol" type="range" min="0" max="100" step="1" value="50" />
              <output id="vol-out" for="vol">50%</output>
            </div>
            <p>Just Need Ya by Reece Rosé &amp; STREETSINEZ (NCS)</p>
          </div>
        </div>
        <button id="grav">Gravity <span class="val">Earth</span></button>
        <button id="rain">Drop tech</button>
        <button id="reset">Start over</button>
        <button class="icon" data-theme-toggle aria-label="Switch theme">
          <svg class="theme-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" /></svg>
          <svg class="theme-dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </div>
    </header>

    <main id="app" class="welcome" data-page="welcome" data-scripts="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js js/characters.js js/welcome.js">
      <a class="skip-intro" href="home.html">Skip the intro</a>
      <div class="wm" id="wm" aria-hidden="true">
        <i class="base"></i><i class="lit" id="lit"></i>
      </div>
      <canvas
        id="c"
        tabindex="0"
        data-focus
        aria-label="Interactive welcome. The letters of the name Daniel fall and pile up. Drag and throw them, type to drop your own letters, tap to drop little tech objects, or hold Space to enter the site."
      ></canvas>

      <div class="guide glass" id="guide">
        <div class="ic">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle class="track" cx="12" cy="12" r="10" />
            <circle class="arc" cx="12" cy="12" r="10" />
          </svg>
        </div>
        <div>
          <b>Press and hold to enter</b><span>Anywhere on the screen, or hold Space</span>
        </div>
      </div>

      <span class="char-slot slot-welcome" data-char="alert"></span>
      <!-- keyboard access to the tech objects: hidden until you tab to them -->
      <div class="tech-ctrl" role="group" aria-label="Play with the tech objects">
        <button type="button" data-tech="terminal">Replay the terminal</button>
        <button type="button" data-tech="enter">Press the Enter key</button>
        <button type="button" data-tech="chip">Light up the microchip</button>
      </div>

      <div class="site" id="site" aria-hidden="true"></div>
    </main>
  </body>
</html>
